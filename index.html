<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dank Memer Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0f19;
    color: #fff;
    min-height: 100vh;
}

header {
    padding: 25px;
    background: #111827;
    border-bottom: 1px solid #273449;
}

header h1 {
    font-size: 28px;
}

header p {
    color: #8d99ae;
    margin-top: 5px;
}

nav {
    display: flex;
    gap: 10px;
    padding: 15px 25px;
    background: #0f1522;
    overflow-x: auto;
}

nav button {
    background: #1a2333;
    color: white;
    border: 1px solid #2d3a50;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
}

nav button:hover,
nav button.active {
    background: #5865f2;
}

main {
    padding: 25px;
    max-width: 1200px;
    margin: auto;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

h2 {
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 15px;
}

.card {
    background: #111827;
    border: 1px solid #273449;
    border-radius: 14px;
    padding: 20px;
}

.card h3 {
    margin-bottom: 10px;
}

.card p {
    color: #aeb8c8;
    margin: 7px 0;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 7px;
    border: 1px solid #344158;
    background: #0b0f19;
    color: white;
}

button {
    border: none;
    border-radius: 7px;
    padding: 9px 13px;
    cursor: pointer;
}

.primary {
    background: #5865f2;
    color: white;
}

.green {
    background: #23a55a;
    color: white;
}

.red {
    background: #ed4245;
    color: white;
}

.gray {
    background: #374151;
    color: white;
}

button:hover {
    opacity: .85;
}

.timer {
    font-size: 25px;
    font-weight: bold;
    margin: 12px 0;
    color: #8ea7ff;
}

.status {
    font-weight: bold;
}

.paid {
    color: #23a55a;
}

.expired {
    color: #ed4245;
}

.progress {
    margin-top: 15px;
    font-size: 18px;
}

.empty {
    color: #7f8a9d;
    padding: 20px 0;
}

form {
    margin-bottom: 25px;
}
</style>
</head>

<body>

<header>
    <h1>🎰 Dank Memer Tracker</h1>
    <p>Your personal grinder & heist dashboard</p>
</header>

<nav>
    <button class="active" onclick="showSection('dashboard', this)">🏠 Dashboard</button>
    <button onclick="showSection('grinders', this)">💳 Grinder Fees</button>
    <button onclick="showSection('heists', this)">🔥 Heist Timer</button>
    <button onclick="showSection('badges', this)">🎖️ Badges</button>
    <button onclick="showSection('achievements', this)">🏆 Achievements</button>
</nav>

<main>

<section id="dashboard" class="section active">
    <h2>Dashboard</h2>

    <div class="grid">
        <div class="card">
            <h3>💳 Grinder Fees</h3>
            <p id="grinderCount">Loading...</p>
        </div>

        <div class="card">
            <h3>🔥 Active Heists</h3>
            <p id="heistCount">Loading...</p>
        </div>

        <div class="card">
            <h3>🎖️ Badges</h3>
            <p id="badgeCount">Loading...</p>
        </div>

        <div class="card">
            <h3>🏆 Achievements</h3>
            <p id="achievementCount">Loading...</p>
        </div>
    </div>
</section>


<section id="grinders" class="section">
    <h2>💳 Grinder Fees</h2>

    <form onsubmit="addGrinder(event)">
        <input id="serverName" placeholder="Server name" required>
        <input id="fee" type="number" placeholder="Fee amount" required>
        <input id="duration" type="number" placeholder="Duration in days" value="7" required>
        <button class="primary">+ Add Grinder</button>
    </form>

    <div id="grinderList" class="grid"></div>
</section>


<section id="heists" class="section">
    <h2>🔥 Heist Timer</h2>

    <form onsubmit="addHeist(event)">
        <input id="heistName" placeholder="Heist name" required>
        <input id="heistDuration" type="number" placeholder="Duration in seconds" required>
        <button class="primary">+ Add Heist</button>
    </form>

    <div id="heistList" class="grid"></div>
</section>


<section id="badges" class="section">
    <h2>🎖️ Badges</h2>

    <div class="progress" id="badgeProgress"></div>
    <div id="badgeList" class="grid"></div>
</section>


<section id="achievements" class="section">
    <h2>🏆 Achievements</h2>

    <div class="progress" id="achievementProgress"></div>
    <div id="achievementList" class="grid"></div>
</section>

</main>


<script>

const SUPABASE_URL = "https://acfbuegbalkdajregyhi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1lY2QetLi82VKWUmS3OM9Q_5J3EE1Vt";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ---------------- NAVIGATION ---------------- */

function showSection(id, button) {

    document.querySelectorAll(".section")
        .forEach(section => section.classList.remove("active"));

    document.getElementById(id).classList.add("active");

    document.querySelectorAll("nav button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
}


/* ---------------- GRINDERS ---------------- */

async function loadGrinders() {

    const { data, error } = await db
        .from("grinder_fees")
        .select("*")
        .order("id", { ascending: true });

    if (error) {
        console.error(error);
        return;
    }

    const list = document.getElementById("grinderList");

    list.innerHTML = "";

    document.getElementById("grinderCount").textContent =
        `${data.length} grinder${data.length === 1 ? "" : "s"}`;

    data.forEach(grinder => {

        const card = document.createElement("div");
        card.className = "card";

        const paidUntil = grinder.paid_until
            ? new Date(grinder.paid_until)
            : null;

        const expired = !paidUntil || paidUntil <= new Date();

        card.innerHTML = `
            <h3>${escapeHTML(grinder.server_name)}</h3>

            <p>💰 Fee: ${Number(grinder.fee).toLocaleString()}</p>

            <p>
                Paid until:
                ${paidUntil ? paidUntil.toLocaleString() : "Not paid"}
            </p>

            <p class="status ${expired ? "expired" : "paid"}">
                ${expired ? "❌ EXPIRED" : "✅ PAID"}
            </p>

            <button class="green"
                onclick="payGrinder(${grinder.id}, 7)">
                PAY 7 DAYS
            </button>

            <button class="gray"
                onclick="payGrinder(${grinder.id}, ${grinder.duration_days})">
                PAY ${grinder.duration_days} DAYS
            </button>

            <button class="red"
                onclick="deleteGrinder(${grinder.id})">
                DELETE
            </button>
        `;

        list.appendChild(card);
    });
}


async function addGrinder(event) {

    event.preventDefault();

    const serverName =
        document.getElementById("serverName").value;

    const fee =
        Number(document.getElementById("fee").value);

    const duration =
        Number(document.getElementById("duration").value);

    const { error } = await db
        .from("grinder_fees")
        .insert({
            server_name: serverName,
            fee: fee,
            duration_days: duration
        });

    if (error) {
        alert(error.message);
        return;
    }

    event.target.reset();

    document.getElementById("duration").value = 7;

    loadGrinders();
}


async function payGrinder(id, days) {

    const { data, error } = await db
        .from("grinder_fees")
        .select("paid_until")
        .eq("id", id)
        .single();

    if (error) {
        alert(error.message);
        return;
    }

    let startDate = new Date();

    if (data.paid_until) {

        const oldDate = new Date(data.paid_until);

        if (oldDate > startDate) {
            startDate = oldDate;
        }
    }

    startDate.setDate(startDate.getDate() + days);

    const { error: updateError } = await db
        .from("grinder_fees")
        .update({
            paid_until: startDate.toISOString()
        })
        .eq("id", id);

    if (updateError) {
        alert(updateError.message);
        return;
    }

    loadGrinders();
}


async function deleteGrinder(id) {

    if (!confirm("Delete this grinder?")) return;

    await db
        .from("grinder_fees")
        .delete()
        .eq("id", id);

    loadGrinders();
}


/* ---------------- HEISTS ---------------- */

async function loadHeists() {

    const { data, error } = await db
        .from("heist_timers")
        .select("*")
        .order("id", { ascending: true });

    if (error) {
        console.error(error);
        return;
    }

    const list = document.getElementById("heistList");

    list.innerHTML = "";

    document.getElementById("heistCount").textContent =
        `${data.length} heist${data.length === 1 ? "" : "s"}`;

    data.forEach(heist => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <h3>${escapeHTML(heist.name)}</h3>

            <div class="timer" id="timer-${heist.id}">
                Loading...
            </div>

            <button class="green"
                onclick="startHeist(${heist.id})">
                START
            </button>

            <button class="gray"
                onclick="resetHeist(${heist.id})">
                RESET
            </button>

            <button class="red"
                onclick="deleteHeist(${heist.id})">
                DELETE
            </button>
        `;

        list.appendChild(card);
    });

    updateTimers(data);
}


async function addHeist(event) {

    event.preventDefault();

    const name =
        document.getElementById("heistName").value;

    const duration =
        Number(document.getElementById("heistDuration").value);

    const { error } = await db
        .from("heist_timers")
        .insert({
            name: name,
            duration_seconds: duration
        });

    if (error) {
        alert(error.message);
        return;
    }

    event.target.reset();

    loadHeists();
}


async function startHeist(id) {

    const { data, error } = await db
        .from("heist_timers")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {
        alert(error.message);
        return;
    }

    const endTime =
        new Date(
            Date.now() +
            data.duration_seconds * 1000
        ).toISOString();

    await db
        .from("heist_timers")
        .update({
            end_time: endTime
        })
        .eq("id", id);

    loadHeists();
}


async function resetHeist(id) {

    await db
        .from("heist_timers")
        .update({
            end_time: null
        })
        .eq("id", id);

    loadHeists();
}


async function deleteHeist(id) {

    if (!confirm("Delete this heist?")) return;

    await db
        .from("heist_timers")
        .delete()
        .eq("id", id);

    loadHeists();
}


function updateTimers(heists) {

    setInterval(() => {

        heists.forEach(heist => {

            const element =
                document.getElementById(`timer-${heist.id}`);

            if (!element) return;

            if (!heist.end_time) {
                element.textContent = "READY";
                return;
            }

            const remaining =
                new Date(heist.end_time).getTime() -
                Date.now();

            if (remaining <= 0) {
                element.textContent = "🔥 HEIST READY!";
                return;
            }

            const totalSeconds =
                Math.floor(remaining / 1000);

            const hours =
                Math.floor(totalSeconds / 3600);

            const minutes =
                Math.floor((totalSeconds % 3600) / 60);

            const seconds =
                totalSeconds % 60;

            element.textContent =
                `${hours}h ${minutes}m ${seconds}s`;
        });

    }, 1000);
}


/* ---------------- BADGES ---------------- */

async function loadBadges() {

    const { data, error } = await db
        .from("badges")
        .select("*")
        .order("id", { ascending: true });

    if (error) {
        console.error(error);
        return;
    }

    const completed =
        data.filter(x => x.completed).length;

    document.getElementById("badgeCount").textContent =
        `${completed}/${data.length} completed`;

    document.getElementById("badgeProgress").textContent =
        `${completed} / ${data.length} completed`;

    const list =
        document.getElementById("badgeList");

    list.innerHTML = "";

    data.forEach(badge => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <h3>${badge.completed ? "✅" : "⬜"} ${escapeHTML(badge.name)}</h3>

            <button
                class="${badge.completed ? "gray" : "green"}"
                onclick="toggleBadge(${badge.id}, ${!badge.completed})">
                ${badge.completed ? "Completed" : "Mark Complete"}
            </button>
        `;

        list.appendChild(card);
    });
}


async function toggleBadge(id, completed) {

    await db
        .from("badges")
        .update({ completed })
        .eq("id", id);

    loadBadges();
}


/* ---------------- ACHIEVEMENTS ---------------- */

async function loadAchievements() {

    const { data, error } = await db
        .from("achievements")
        .select("*")
        .order("id", { ascending: true });

    if (error) {
        console.error(error);
        return;
    }

    const completed =
        data.filter(x => x.completed).length;

    document.getElementById("achievementCount").textContent =
        `${completed}/${data.length} completed`;

    document.getElementById("achievementProgress").textContent =
        `${completed} / ${data.length} completed`;

    const list =
        document.getElementById("achievementList");

    list.innerHTML = "";

    data.forEach(achievement => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <h3>
                ${achievement.completed ? "✅" : "⬜"}
                ${escapeHTML(achievement.name)}
            </h3>

            <button
                class="${achievement.completed ? "gray" : "green"}"
                onclick="toggleAchievement(${achievement.id}, ${!achievement.completed})">
                ${achievement.completed ? "Completed" : "Mark Complete"}
            </button>
        `;

        list.appendChild(card);
    });
}


async function toggleAchievement(id, completed) {

    await db
        .from("achievements")
        .update({ completed })
        .eq("id", id);

    loadAchievements();
}


/* ---------------- SECURITY ---------------- */

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ---------------- START ---------------- */

async function loadEverything() {

    await loadGrinders();
    await loadHeists();
    await loadBadges();
    await loadAchievements();
}

loadEverything();

</script>

</body>
</html>
